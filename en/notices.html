<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hibi News</title>
  <meta name="description" content="News from hibi (a journal app): updates, new features, and other announcements.">
  <link rel="canonical" href="https://hibi.bmtx.jp/en/notices.html">
  <link rel="alternate" hreflang="ja" href="https://hibi.bmtx.jp/notices.html">
  <link rel="alternate" hreflang="en" href="https://hibi.bmtx.jp/en/notices.html">
  <link rel="alternate" hreflang="x-default" href="https://hibi.bmtx.jp/notices.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="hibi">
  <meta property="og:title" content="hibi News">
  <meta property="og:url" content="https://hibi.bmtx.jp/en/notices.html">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@100&display=swap" rel="stylesheet">
  <style>
    :root {
      /* [T209] 生成り版（2026-09-22 / Client Agent）。
         値は 03_design/20260922_t209_lp_full_design.md §1・§0-7。
         小さい琥珀文字は --accent:#8E5F2A（対 --bg 5.10:1 = WCAG AA）。
         図形用の #B07A3E（3.42:1）は文字には使わない。 */
      --bg: #FAF6EF;
      --surface: #F6F0E5;
      --surface-deep: #F0E7D8;
      --text: #1A1209;
      --text-body: #2E2419;
      --text-sub: #4A3826;
      --text-dim: #6B584A;
      --accent: #8E5F2A;
      --accent-light: rgba(142,95,42,0.10);
      --border: rgba(43,29,12,0.10);
      --border-strong: rgba(43,29,12,0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text-body);
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      line-height: 1.8;
    }
    body { min-height: 100vh; padding: 0; }
    .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }

    /* ===== サイト共通ヘッダー ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .site-header .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      text-decoration: none;
      line-height: 1;
    }
    .site-header .brand-mark {
      font-family: 'Outfit', sans-serif;
      font-weight: 100;
      font-size: 22px;
      color: #2A1F12;   /* [T209] 生成り地のワードマーク（LP と同じ） */
      letter-spacing: 0;
      line-height: 1;
    }
    /* [T149] ワードマーク = A″-F のアウトライン SVG（書体依存を排除）。
       height を em で持つので、上の font-size 指定がそのまま効く。
       .703125em = 旧 Outfit Thin の "hibi" のインク高さ ÷ font-size（実測 703.125/1000）。
       上下 padding は line-height:1 で組んでいた旧行箱（1em）の再現値。 */
    .site-header .wm-svg {
      display: block;
      height: 0.703125em;
      width: auto;
      fill: currentColor;
      box-sizing: content-box;
      padding: 0.166875em 0 0.13em;
    }
    /* 文字は DOM に残して視覚的にだけ隠す（読み上げ・検索エンジン向け） */
    .wm-sr {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .site-header .brand-underline {
      margin-top: 5px;
      width: 32px;
      height: 1px;
      background: #B07A3E;   /* [T209] 罫は図形用の琥珀（LP と同じ） */
      opacity: 0.8;
    }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      flex-wrap: wrap;
    }
    .site-nav a {
      color: var(--text-sub);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-bottom-color 0.15s;
    }
    .site-nav a:hover { color: var(--text); }
    .site-nav a.current {
      color: var(--accent);
      border-bottom-color: rgba(142, 95, 42, 0.5);
    }
    .site-nav .lang-switch {
      color: var(--text-dim);
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }
    .site-nav .lang-switch:hover { color: var(--text-sub); }
    .site-header + main { padding-top: 24px; }

    /* ===== ページ本体 ===== */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    header.page-header {
      text-align: center;
      padding: 16px 0 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    header.page-header h1 {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: var(--text);
      text-transform: uppercase;
    }
    header.page-header .sub {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--accent);
    }
    header.page-header .ja {
      margin-top: 14px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    header.page-header .intro {
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.75;
    }

    /* ===== お知らせカード ===== */
    .notice-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px 20px 28px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.15s, background 0.15s;
    }
    .notice-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 1px;
      background: var(--accent);
      opacity: 0.4;
    }
    .notice-card.important::before { opacity: 0.85; }
    .notice-card[open] { border-color: var(--border-strong); }

    .notice-card > summary {
      list-style: none;
      cursor: pointer;
      padding: 0 28px 0 0;
      position: relative;
    }
    .notice-card > summary::-webkit-details-marker { display: none; }
    .notice-card > summary::after {
      content: '+';
      position: absolute;
      right: 0;
      top: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: var(--accent);
      font-weight: 400;
      transition: transform 0.15s;
    }
    .notice-card[open] > summary::after { content: '−'; }
    .notice-card > summary:hover { color: var(--accent); }

    .notice-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 11px;
      flex-wrap: wrap;
    }
    .notice-date {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }
    .notice-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #7A4F1E;   /* [T209] 9px の最小文字。tint の上でも 5.3:1 */
      background: var(--accent-light);
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .notice-category.maintenance {
      color: #70520F;
      background: rgba(112, 82, 15, 0.12);
    }
    .notice-important-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #8C3428;
      background: rgba(140, 52, 40, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .notice-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-top: 8px;
      letter-spacing: -0.01em;
      line-height: 1.5;
    }

    .notice-body-wrap {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .notice-log-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .notice-body {
      font-size: 14px;
      line-height: 1.85;
      color: var(--text-body);
    }

    /* [T057] 英語のお知らせが無いときの「日本語のお知らせ」へのリンク（en/terms.html の .translation-note a と同じ値） */
    .notice-empty a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(142,95,42,0.35);
      padding-bottom: 1px;
    }
    .notice-empty a:hover { border-bottom-color: var(--accent); }
    .notice-empty,
    .notice-error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.75;
    }

    footer.page-footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* [T057] ナビの置き方を規約・プライバシー・FAQ・トップと同じにする（Kenny 2026-11-04「全部おすすめで」）。
       前は 640 以下でナビを幅いっぱいにしてロゴの下の段に置いていた。今はロゴの横に並べ、入りきらない幅（360 など）だけ下の段に落ちる。
       字 11px・間 14px・切り替えの左の余白 0 は 400 以下だけ（他のページと同じ） */
    @media (max-width: 400px) {
      .site-nav { gap: 14px; font-size: 11px; }
      .site-nav .lang-switch { margin-left: 0; padding-left: 8px; }
    }
    @media (max-width: 640px) {
      .site-header {
        padding: 12px 20px;
        gap: 10px;
      }
      .site-header .brand-mark { font-size: 20px; }
      .site-header + main { padding-top: 20px; }
      main { padding: 20px 16px 60px; }
      .notice-card { padding: 16px 20px 16px 24px; }
      .notice-title { font-size: 15px; }
      .notice-body { font-size: 13.5px; }
      footer.page-footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/en/" aria-label="hibi - public documents">
      <span class="brand-mark"><svg class="wm-svg" viewBox="0 48 329.5 152" aria-hidden="true" focusable="false"><path d="M0,48 h26 v152 h-26 Z"/><path d="M0,150 A47,50 0 0 1 94,150 L68,150 A21,25 0 0 0 26,150 Z"/><path d="M68,148 h26 v52 h-26 Z"/><path d="M120,100 h26 v100 h-26 Z"/><circle cx="133" cy="68.5" r="20.5"/><path d="M176,150 A50,50 0 0 1 276,150 A50,50 0 0 1 176,150 Z M202,150 A24,24 0 0 0 250,150 A24,24 0 0 0 202,150 Z M176,48 h26 v152 h-26 Z"/><path d="M296,100 h26 v100 h-26 Z"/><circle cx="309" cy="68.5" r="20.5"/></svg><span class="wm-sr">hibi</span></span>
      <span class="brand-underline"></span>
    </a>
    <nav class="site-nav" aria-label="Global navigation">
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms of Use</a>
      <a href="./faq.html">FAQ</a>
      <a class="current" href="./notices.html">News</a>
      <a class="lang-switch" href="../notices.html" hreflang="ja" lang="ja">日本語</a>
    </nav>
  </header>

  <main>
    <header class="page-header">
      <div class="ja">News</div>
    </header>

    <div id="notices-container">
      <div class="notice-empty">Loading…</div>
    </div>

    <!-- [T057] 英語のページは、日本語のページの予備の JSON（file:// で開いたとき用）を持たない。
         notices.json を読めなかったときは、読めなかった旨の 1 文を出す。 -->

    <footer class="page-footer">
      <span>HIBI_NOTICES</span>
      <span>END_OF_LOGS</span>
    </footer>
  </main>

  <script>
    (function() {
      const CATEGORY_LABEL = {
        release: 'RELEASE',
        feature: 'FEATURE',
        maintenance: 'MAINTENANCE',
      };

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, ch => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;',
        }[ch]));
      }

      function formatDate(yyyymmdd) {
        return String(yyyymmdd).replace(/-/g, '.');
      }

      function renderNotice(notice) {
        const date = formatDate(notice.date);
        const cat = CATEGORY_LABEL[notice.category] || 'NOTICE';
        const catClass = notice.category === 'maintenance' ? ' maintenance' : '';
        const importantClass = notice.important ? ' important' : '';
        const importantPill = notice.important
          ? '<span class="notice-important-pill">Important</span>'
          : '';
        const title = escapeHtml(notice.title);
        const body = escapeHtml(notice.body).replace(/\n/g, '<br>');
        const id = escapeHtml(notice.id);

        return `
<details class="notice-card${importantClass}">
  <summary>
    <div class="notice-meta">
      <span class="notice-date mono">${date}</span>
      <span class="notice-category${catClass}">${cat}</span>
      ${importantPill}
    </div>
    <div class="notice-title">${title}</div>
  </summary>
  <div class="notice-body-wrap">
    <div class="notice-log-id">LOG_ID // #${id}</div>
    <div class="notice-body">${body}</div>
  </div>
</details>`;
      }

      // [T057] 英語の題（title_en）と英語の本文（body_en）が両方あるお知らせだけにして、題と本文を英語の文に置き換える。
      //   notices.json の形は変えない（日本語の題・本文はそのまま。英語の 2 つは足すだけ）。
      //   日付の書き方は日本語のページ・アプリ（英語の画面も）と同じ YYYY.MM.DD（app/components/NoticesPage.js の formatDateDot）
      function toEnglish(list) {
        return (Array.isArray(list) ? list : [])
          .filter(n => n
            && typeof n.title_en === 'string' && n.title_en.trim()
            && typeof n.body_en === 'string' && n.body_en.trim())
          .map(n => Object.assign({}, n, { title: n.title_en, body: n.body_en }));
      }

      function render(all) {
        const container = document.getElementById('notices-container');
        const notices = toEnglish(all);
        if (notices.length === 0) {
          container.innerHTML = '<div class="notice-empty">No news in English yet.<br><a href="../notices.html" hreflang="ja">See the news in Japanese</a></div>';
          return;
        }
        const sorted = notices.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        container.innerHTML = sorted.map(renderNotice).join('');
      }

      function renderError(msg) {
        const container = document.getElementById('notices-container');
        container.innerHTML = `<div class="notice-error">${escapeHtml(msg)}</div>`;
      }

      document.addEventListener('DOMContentLoaded', function() {
        fetch('../notices.json', { cache: 'no-cache' })
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(data => {
            if (!Array.isArray(data)) throw new Error('notices.json is not an array');
            render(data);
          })
          .catch(err => {
            console.warn('[notices] fetch failed:', err);
            renderError("Couldn't load News. Check your connection and try again.");
          });
      });
    })();
  </script>
</body>
</html>
